name: Update A.I. article counts
on:
  schedule:
    - cron: "0 12 1 * *"   # 12:00 UTC on the 1st of each month
  workflow_dispatch: {}      # also lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nyer_ai_tracker.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cache.json output/
          git diff --cached --quiet || git commit -m "Monthly update: $(date -u +%Y-%m-%d)"
          git push
